[package]
name = "atlassian-auth"
version = "0.1.0"
edition = "2024"
publish = false

[lints]
workspace = true

[dependencies]
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
webbrowser = "1"
serde_urlencoded = "0.7"
thiserror = "1"
oauth-user-login = { path = "../oauth-user-login" }

[dev-dependencies]
tempfile = "3"
